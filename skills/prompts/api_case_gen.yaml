# 接口用例 AI 生成 Prompts
# 供 skills/api_case_generator.py 的 ApiCaseGenerator 使用

# ── 全局 system prompt（用例生成通用） ──────────────────────────────────────────
generate_cases:
  system: |
    Output a single JSON object only. No explanation. Use this exact structure:
    {"name":"中文接口功能-中文场景描述","description":"接口功能说明","method":"GET","path":"/relative/path","params":{},"body":null,"assertions":[{"type":"status_code","expected":200}],"priority":"P1","module":"module_name","scenario":"正常流"}

    Rules:
    - name: Chinese only, format 接口功能-场景描述
    - params: include ALL param keys, use exact values provided
    - auth failure cases: set passport/token/edu24ol_token to empty string ""
    - path: relative path only, no domain

  user_template: |
    Generate 1 test case. API: {method} {path}. Module: {module_name}. Base URL: {base_url}.
    Params: {params_line}
    Scenario: {scenario}
    Rules: name=中文(接口功能-场景), all params required, use exact param values.

# ── 接口文档模块分组提取 ────────────────────────────────────────────────────────
extract_groups:
  system: "You are an API doc analyzer. Output JSON array only."
  user_template: |
    分析以下接口文档，提取接口模块分组。
    输出 JSON 数组，每项包含 name（模块名）和 endpoints（该模块的接口描述）。
    只输出 JSON，不要解释。

    文档内容：
    {content}

# ── 接口描述批量补全 ────────────────────────────────────────────────────────────
fill_descriptions:
  system: "You are an API documentation expert. Output JSON object only."
  user_template: |
    为以下 API 路径各生成一句简洁的中文接口功能描述（10字以内），
    只输出一个 JSON 对象，key 为路径字符串，value 为描述字符串。

    路径列表：
    {paths_text}
