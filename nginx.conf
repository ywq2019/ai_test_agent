# AI 测试工具平台 — Nginx 反向代理配置
# 启用方式：docker compose --profile nginx up -d
#
# 如需 HTTPS，取消下方 ssl 注释，并将证书放至 /etc/letsencrypt/live/<domain>/

server {
    listen 80;
    # listen 443 ssl;
    server_name _;           # 替换为你的域名，如 test.example.com

    # SSL（Let's Encrypt，取消注释后使用）
    # ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    # ssl_protocols       TLSv1.2 TLSv1.3;
    # ssl_ciphers         HIGH:!aNULL:!MD5;

    # HTTP → HTTPS 重定向（启用 HTTPS 后取消注释）
    # if ($scheme != "https") {
    #     return 301 https://$host$request_uri;
    # }

    client_max_body_size 25m;   # 与 MAX_UPLOAD_SIZE 对齐（20MB + 余量）

    # 传递真实客户端 IP
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # ── WebSocket 升级 ──────────────────────────────────────────────────────
    location /ws {
        proxy_pass          http://app:4000;
        proxy_http_version  1.1;
        proxy_set_header    Upgrade    $http_upgrade;
        proxy_set_header    Connection "upgrade";
        proxy_read_timeout  3600s;   # WebSocket 长连接，不超时
    }

    # ── API 接口 ────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://app:4000;
        proxy_read_timeout 660s;     # 覆盖最长任务：压测执行（600s）+ 余量
    }

    # ── Mock 服务（无 JWT，路径在 /api/v1 之外）────────────────────────────
    location /mock/ {
        proxy_pass         http://app:4000;
        proxy_read_timeout 30s;
    }

    # ── 静态文件 / 前端 ────────────────────────────────────────────────────
    location / {
        proxy_pass         http://app:4000;
        proxy_read_timeout 60s;
    }
}
