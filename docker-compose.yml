services:

  # ── PostgreSQL + pgvector ────────────────────────────────────────────────────
  db:
    image: pgvector/pgvector:pg15
    container_name: ai-test-db
    env_file:
      - .env.docker
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-uitest}
      POSTGRES_USER:     ${POSTGRES_USER:-uitest}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-uitest123456}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - ai-test-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uitest} -d ${POSTGRES_DB:-uitest}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Redis（ARQ 任务队列，可选）────────────────────────────────────────────────
  # 不配置 REDIS_URL 时任务队列自动降级为 BackgroundTasks，此服务可不启动
  redis:
    image: redis:7-alpine
    container_name: ai-test-redis
    command: ["redis-server", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    networks:
      - ai-test-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── 应用服务 ─────────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-test-agent
    ports:
      - "${APP_PORT:-4000}:4000"
    env_file:
      - .env.docker
    volumes:
      - app_data:/data
    networks:
      - ai-test-net
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── ARQ Worker（任务队列执行器，需 Redis，可选）──────────────────────────────
  # 启动方式：docker compose --profile worker up -d
  # 可独立扩容：docker compose --profile worker up -d --scale worker=3
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-test-worker
    profiles:
      - worker
    command: ["python", "-m", "arq", "worker.arq_worker.WorkerSettings"]
    env_file:
      - .env.docker
    volumes:
      - app_data:/data
    networks:
      - ai-test-net
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Nginx 反向代理（可选，默认不启动）──────────────────────────────────────
  # 启动方式：docker compose --profile nginx up -d
  nginx:
    image: nginx:alpine
    container_name: ai-test-nginx
    profiles:
      - nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro      # SSL 证书（Let's Encrypt）
    networks:
      - ai-test-net
    depends_on:
      - app
    restart: unless-stopped

# ── 命名卷 ───────────────────────────────────────────────────────────────────
volumes:
  pg_data:
    driver: local
  app_data:
    driver: local

# ── 网络 ─────────────────────────────────────────────────────────────────────
networks:
  ai-test-net:
    driver: bridge
